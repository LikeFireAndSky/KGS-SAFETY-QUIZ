version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 22
        - node --version
        - npm install -g npm@latest
        - npm ci
    build:
      commands:
        - echo "APP_REGION=${APP_REGION}" >> .env.production
        - echo "APP_ACCESS_KEY_ID=${APP_ACCESS_KEY_ID}" >> .env.production
        - echo "APP_SECRET_ACCESS_KEY=${APP_SECRET_ACCESS_KEY}" >> .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
